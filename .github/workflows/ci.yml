name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Type check (mypy, strict)
        run: mypy

      # No API keys are configured for CI, and none are needed: the suite runs against
      # deterministic stand-in providers. A green build therefore means the logic is
      # correct, not that a model happened to behave.
      - name: Tests
        run: pytest

  benchmark:
    name: Retrieval benchmark
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Scored on the synthetic validation corpus with the offline providers, so the
      # numbers are reproducible run to run. They measure the retrieval architecture, not
      # model quality — see REPORT.md for the live figures.
      - name: Score retrieval strategies
        run: python -m detective eval --offline --output benchmark.md

      - name: Publish to job summary
        run: |
          {
            echo "## Retrieval benchmark"
            echo
            echo "_Synthetic validation corpus, deterministic offline providers._"
            echo
            cat benchmark.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: benchmark.md
